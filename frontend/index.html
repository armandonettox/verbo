<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta
      name="description"
      content="Pergunte e descubra passagens biblicas com compreensao semantica."
    />
    <title>Verbo</title>
  </head>
  <body>
    <script>
      // Aplica o tema salvo antes do React carregar, para a tela nao piscar no claro
      (function () {
        try {
          if (localStorage.getItem("tema") === "escuro") {
            document.documentElement.setAttribute("data-tema", "escuro");
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
