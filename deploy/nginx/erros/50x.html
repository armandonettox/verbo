<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verbo - fora do ar</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FBF6EC;
        color: #3B2A1E;
        font-family: "Source Sans Pro", -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 28rem;
        padding: 1.5rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2rem;
      }
      p {
        margin: 0.4rem 0;
        color: #6B4F3A;
      }
      a {
        color: #B8860B;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #221A12;
          color: #F1E8D8;
        }
        p {
          color: #C9B79E;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Verbo</h1>
      <p>O servico esta temporariamente indisponivel.</p>
      <p>Isso costuma durar poucos minutos. <a href="/">Tentar novamente</a></p>
    </main>
  </body>
</html>
