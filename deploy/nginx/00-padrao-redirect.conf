# Servidor padrao do nginx da VPS para HTTPS
#
# Atende qualquer nome que NAO tenha bloco proprio (por exemplo, um DNS no Cloudflare apontando
# para a VPS antes do site existir, ou um nome digitado errado). Sem este bloco o nginx entrega o
# primeiro servidor carregado, que e o do hermes, e mostraria a tela de login dele num endereco
# que nao e dele (aconteceu com verbo.armandonetto.com antes do bloco do verbo existir).
#
# Aqui o visitante vai para o dominio principal. Usa 302 e nao 301 de proposito: o navegador nao
# guarda o 302, entao quando o site do subdominio passar a existir ele aparece sem precisar
# limpar cache.
#
# Este arquivo vale para a VPS inteira (hermes, novo/portfolio, verbo e o que vier). O deploy do
# verbo e quem o instala em /etc/nginx/conf.d/00-padrao-redirect.conf. Reaproveita o certificado
# wildcard do Cloudflare e exige o certificado de cliente do Cloudflare, como os outros sites.
#
# So cobre a porta 443, que e a que o Cloudflare usa (modo Full Strict). A porta 80 continua com
# a pagina padrao do nginx (sites-enabled/default), acessivel so por quem bate direto no IP.

server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/ssl/cloudflare/hera.armandonetto.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/hera.armandonetto.com.key;

    ssl_client_certificate /etc/ssl/cloudflare/origin_pull_ca.pem;
    ssl_verify_client on;

    return 302 https://armandonetto.com/;
}
