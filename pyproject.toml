[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verbo"
version = "1.0.0"
description = "RAG semantico sobre a Biblia Ave Maria, com busca por similaridade e respostas geradas por IA"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "streamlit==1.60.0",
    "chromadb==1.5.9",
    "openai==2.48.0",
    "python-dotenv==1.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
