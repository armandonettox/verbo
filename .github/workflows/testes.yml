name: testes

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependencias
        run: |
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
          pip install -r tests/requirements.txt

      - name: Roda testes unitarios e da API
        run: pytest tests/unit tests/backend -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      # Navegador de verdade com tela de computador e de celular (toque, largura, paisagem)
      - name: Instala o navegador dos testes e2e
        run: npx playwright install --with-deps chromium

      - name: Testes e2e
        run: npx playwright test

      - name: Guarda o relatorio dos testes e2e quando falham
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-e2e
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
