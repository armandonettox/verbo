# Verbo: backend (API) e frontend (React servido pelo nginx).
#
# Local (docker): docker compose up --build, com VERBO_BACKEND_URL=http://verbo-backend:8000
# Na VPS (podman-compose): as imagens vem do GHCR (VERBO_BACKEND_IMAGE e VERBO_FRONTEND_IMAGE,
# definidas em ~/verbo/.env.imagens pelo deploy) e o nginx do host entrega o trafego do
# Cloudflare ao frontend em 127.0.0.1:8020. Ver deploy/README.md.
services:
  verbo-backend:
    image: ${VERBO_BACKEND_IMAGE:-verbo-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: verbo-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - verbo-dados:/dados
    # sem porta publicada: so o frontend (mesmo pod ou mesma rede) acessa a API
    expose:
      - "8000"
    # Declarado aqui (e nao so no Dockerfile) porque o podman ignora o HEALTHCHECK de imagens
    # no formato OCI. Serve para monitoramento (podman ps) e para o docker; o frontend nao
    # espera por ele (ver depends_on abaixo).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/saude', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # a VM da Oracle e compartilhada com o hera; este limite impede o verbo de
    # derrubar o resto se o consumo de memoria crescer
    mem_limit: 1500m
    cpus: 0.8

  verbo-frontend:
    image: ${VERBO_FRONTEND_IMAGE:-verbo-frontend:local}
    build:
      context: frontend
    container_name: verbo-frontend
    restart: unless-stopped
    depends_on:
      # service_started e nao service_healthy: no podman rootless, quando o compose sobe pela
      # unit do systemd, as checagens de saude nunca chegam a rodar e o frontend ficaria
      # esperando para sempre. O nginx do frontend usa um IP fixo para o backend, entao sobe
      # antes dele responder; a saude real e conferida por HTTP no script de deploy.
      verbo-backend:
        condition: service_started
    environment:
      # No podman-compose os servicos dividem um pod, entao 127.0.0.1 chega no backend sem
      # depender do DNS interno (o aardvark-dns ja travou na VPS e derrubou o hera por dias).
      # Em docker puro, use VERBO_BACKEND_URL=http://verbo-backend:8000
      BACKEND_URL: ${VERBO_BACKEND_URL:-http://127.0.0.1:8000}
    # so o nginx do host acessa; nao expor direto na internet
    ports:
      - "127.0.0.1:8020:8080"
    mem_limit: 64m
    cpus: 0.2

volumes:
  verbo-dados:
